<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#aaaaaa">
  <meta name="description" content="NV2 player leaderboard stats.">
  <title>Player — Nv2 Leaderboards</title>
  <link rel="stylesheet" href="styles.css?v=metanet-level-histograms">
  <script src="app.js?v=metanet-level-histograms" defer></script>
</head>
<body data-page="player">
  <div class="page-shell">
    <header class="site-header">
      <h1 class="site-title"><a href="/nv2-metanet-records/" aria-label="Nv2 Leaderboards home">Nv2 Leaderboards</a></h1>
      <div class="site-header-tools">
        <span id="last-updated" class="last-updated">Last Updated: 11/03/26</span>
        <div class="level-toggle" role="group" aria-label="Level type">
          <button type="button" data-levelset="metanet" aria-pressed="true">Metanet levels</button>
          <button type="button" data-levelset="user" aria-pressed="false">User levels</button>
        </div>
      </div>
    </header>

    <form id="player-search-form" class="player-search" role="search">
      <label class="visually-hidden" for="player-search-input">Search players or levels</label>
      <div class="player-search-box">
        <input id="player-search-input" type="search" placeholder="Search players or levels" autocomplete="off" aria-controls="player-search-results">
        <button type="submit">Search</button>
        <div id="player-search-results" class="player-search-results" role="listbox" hidden></div>
      </div>
      <span id="player-search-status" class="player-search-status" role="status" aria-live="polite"></span>
    </form>

    <nav class="leaderboard-nav" aria-label="Leaderboards" role="tablist">
      <button type="button" role="tab" data-board="zeroes" aria-selected="true">0ths</button>
      <button type="button" role="tab" data-board="boards" aria-selected="false">Total Boards</button>
      <button type="button" role="tab" data-board="points" aria-selected="false">Points</button>
      <button type="button" role="tab" data-board="elite" aria-selected="false" hidden>Elite Levels</button>
      <button type="button" role="tab" data-board="loneWolfs" aria-selected="false" hidden>Lone Wolfs</button>
      <button type="button" role="tab" data-board="average" aria-selected="false">Average Place</button>
    </nav>

    <main id="leaderboard-view" hidden></main>
    <main id="player-view" hidden></main>
  </div>
</body>
</html>
